name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Throwaway database used only by this job. The otp/schema checks leave rows (the audit ledger is append-only).
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/saad_albaqmi
      ALLOW_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (libraries, web app, API)
        run: pnpm run typecheck
      - name: Create and migrate the database
        run: |
          pnpm --filter @workspace/db run create-db
          pnpm --filter @workspace/db run migrate
      - name: Schema constraints, triggers and views
        run: pnpm --filter @workspace/db run check:schema
      - name: Every table documented (ER generation)
        run: pnpm --filter @workspace/db run er
      - name: Access scoping
        run: pnpm --filter @workspace/api-server run check:access
      - name: Cost engine
        run: pnpm --filter @workspace/api-server run check:costing
      - name: OTP service and audit ledger
        run: pnpm --filter @workspace/api-server run check:otp
      - name: Inventory service
        run: pnpm --filter @workspace/api-server run check:inventory
      - name: Procurement cycle
        run: pnpm --filter @workspace/api-server run check:procurement
      - name: Fulfilment (receipt, invoice match, payment)
        run: pnpm --filter @workspace/api-server run check:fulfilment
      - name: HR and delegation
        run: pnpm --filter @workspace/api-server run check:hr
      - name: Budgets, VAT and sales invoices
        run: pnpm --filter @workspace/api-server run check:fiscal
      - name: Digital cards and attendance
        run: pnpm --filter @workspace/api-server run check:cards
      - name: Legacy importer
        run: pnpm --filter @workspace/db run check:import
      - name: Production build of the API (same command as the server deploy)
        run: pnpm --filter @workspace/api-server run build
      - name: Production build of the web app (same command as the server deploy)
        env:
          PORT: "3000"
          BASE_PATH: /
          NODE_ENV: production
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
        run: pnpm --filter @workspace/saad-albaqmi run build
