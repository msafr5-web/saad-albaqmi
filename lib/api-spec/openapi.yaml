openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /workspace:
    get:
      operationId: getWorkspace
      responses:
        "200":
          description: Workspace identity; anonymous visitors get read-only illustrative data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
  /records:
    get:
      operationId: listRecords
      responses:
        "200":
          description: All records in the current isolated workspace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EducationRecord"
    post:
      operationId: createRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EducationRecord"
  /records/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: updateRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EducationRecord"
    delete:
      operationId: deleteRecord
      responses:
        "204":
          description: Deleted
  /summary:
    get:
      operationId: getSummary
      responses:
        "200":
          description: Computed branch financial and operational summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
  /payroll:
    get:
      operationId: getPayroll
      parameters:
        - in: query
          name: from
          required: false
          schema: { type: string }
        - in: query
          name: to
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Instructor dues computed only from sessions actually held (status done)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payroll"
  /ledger:
    get:
      operationId: getLedger
      responses:
        "200":
          description: Per-student financial ledger with installment schedule and payment allocation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentLedger"
  /cost-policy:
    get:
      operationId: getCostPolicy
      responses:
        "200":
          description: Draft and approved cost-allocation policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostPolicyState"
    put:
      operationId: saveCostPolicyDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CostPolicy"
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostPolicyState"
  /cost-policy/approve:
    post:
      operationId: approveCostPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovePolicyRequest"
      responses:
        "200":
          description: Draft frozen as the approved policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostPolicyState"
  /cost-report:
    get:
      operationId: getCostReport
      parameters:
        - in: query
          name: from
          required: false
          schema: { type: string }
        - in: query
          name: to
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Period, branch and diploma cost report computed only from the approved policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostReport"
  /team:
    get:
      operationId: listTeam
      responses:
        "200":
          description: Organization members and pending invitations (top-level administrators only)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
  /team/audit:
    get:
      operationId: listAudit
      responses:
        "200":
          description: Latest organization audit entries (top-level administrators only)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
  /team/invitations:
    post:
      operationId: inviteMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invitation created; it is claimed only by a Clerk-verified matching email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
  /team/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: updateMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated role or scope, or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    Role:
      type: string
      enum: [super_admin, branch_manager, finance, coordinator, instructor, student, warehouse_keeper, procurement_officer, hr_officer]
    Workspace:
      type: object
      required: [mode, canWrite, label, role, branchId, pages, writableKinds, canManageTeam, canViewPayroll, canViewLedger]
      properties:
        mode: { type: string, enum: [demo, personal, organization] }
        canWrite: { type: boolean }
        label: { type: string }
        role:
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
        branchId: { type: [integer, "null"] }
        pages:
          type: array
          items: { type: string }
        writableKinds:
          type: array
          items: { type: string }
        canManageTeam: { type: boolean }
        canViewPayroll: { type: boolean }
        canViewLedger: { type: boolean }
    TeamMember:
      type: object
      required: [id, email, role, branchId, linkedRecordId, status, createdAt, activatedAt]
      properties:
        id: { type: integer }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        branchId: { type: [integer, "null"] }
        linkedRecordId: { type: [integer, "null"] }
        status: { type: string, enum: [invited, active, revoked] }
        createdAt: { type: string }
        activatedAt: { type: [string, "null"] }
        emailSent: { type: boolean, description: "Only on invitation creation: whether the invitation email was delivered" }
        emailError: { type: [string, "null"], description: "Only on invitation creation: why the email was not sent" }
    AuditEntry:
      type: object
      required: [id, action, recordId, actorId, actorEmail, createdAt]
      properties:
        id: { type: integer }
        action: { type: string }
        recordId: { type: integer }
        actorId: { type: [string, "null"] }
        actorEmail: { type: [string, "null"] }
        createdAt: { type: string }
    InviteInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, maxLength: 200 }
        role: { $ref: "#/components/schemas/Role" }
        branchId: { type: [integer, "null"] }
        linkedRecordId: { type: [integer, "null"] }
    MemberUpdate:
      type: object
      properties:
        role: { $ref: "#/components/schemas/Role" }
        branchId: { type: [integer, "null"] }
        linkedRecordId: { type: [integer, "null"] }
        status: { type: string, enum: [revoked] }
    RecordInput:
      type: object
      required: [kind, name, status, details]
      properties:
        kind:
          type: string
          enum: [branch, room, asset, diploma, level, subject, student, instructor, expense, invoice, session, payment, installment, attendance, grade]
        name: { type: string, minLength: 1, maxLength: 200 }
        branchId: { type: [integer, "null"] }
        status: { type: string, maxLength: 50 }
        details:
          type: object
          additionalProperties: true
    EducationRecord:
      allOf:
        - $ref: "#/components/schemas/RecordInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer }
            createdAt: { type: string }
    BranchSummary:
      type: object
      required: [id, name, budget, spent, collected, students, rooms, usage, alert]
      properties:
        id: { type: integer }
        name: { type: string }
        budget: { type: number }
        spent: { type: number }
        collected: { type: number }
        students: { type: integer }
        rooms: { type: integer }
        usage: { type: number }
        alert: { type: string }
    Summary:
      type: object
      required: [students, instructors, branches, diplomas, expenses, collected, branchSummaries, recent]
      properties:
        students: { type: integer }
        instructors: { type: integer }
        branches: { type: integer }
        diplomas: { type: integer }
        expenses: { type: number }
        collected: { type: number }
        branchSummaries:
          type: array
          items: { $ref: "#/components/schemas/BranchSummary" }
        recent:
          type: array
          items: { $ref: "#/components/schemas/EducationRecord" }
    PayrollLine:
      type: object
      required: [instructorId, name, branchId, hourlyRate, heldSessions, heldHours, earned, scheduledSessions, scheduledHours]
      properties:
        instructorId: { type: integer }
        name: { type: string }
        branchId: { type: [integer, "null"] }
        hourlyRate: { type: number }
        heldSessions: { type: integer }
        heldHours: { type: number }
        earned: { type: number }
        scheduledSessions: { type: integer }
        scheduledHours: { type: number }
    Payroll:
      type: object
      required: [from, to, total, lines]
      properties:
        from: { type: [string, "null"] }
        to: { type: [string, "null"] }
        total: { type: number }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PayrollLine" }
    LedgerInstallment:
      type: object
      required: [id, name, dueDate, amount, paid, remaining, state]
      properties:
        id: { type: integer }
        name: { type: string }
        dueDate: { type: string }
        amount: { type: number }
        paid: { type: number }
        remaining: { type: number }
        state: { type: string, enum: [paid, partial, pending, overdue] }
    LedgerPayment:
      type: object
      required: [id, name, date, amount]
      properties:
        id: { type: integer }
        name: { type: string }
        date: { type: string }
        amount: { type: number }
    StudentLedger:
      type: object
      required: [studentId, name, branchId, diplomaId, fees, planned, paid, balance, overdue, unallocated, installments, payments]
      properties:
        studentId: { type: integer }
        name: { type: string }
        branchId: { type: [integer, "null"] }
        diplomaId: { type: [integer, "null"] }
        fees: { type: number }
        planned: { type: number }
        paid: { type: number }
        balance: { type: number }
        overdue: { type: number }
        unallocated: { type: number }
        installments:
          type: array
          items: { $ref: "#/components/schemas/LedgerInstallment" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/LedgerPayment" }
    CostPolicy:
      type: object
      required: [period, components, electricity, depreciation, revenueRecognition, basis]
      properties:
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string }
            to: { type: string }
        components:
          type: object
          required: [expenses, electricity, depreciation, instructorPay]
          properties:
            expenses: { type: boolean }
            electricity: { type: boolean }
            depreciation: { type: boolean }
            instructorPay: { type: boolean }
        electricity:
          type: [object, "null"]
          required: [method, meterAssignments]
          properties:
            method: { type: string, enum: [meter, area, power_hours] }
            meterAssignments:
              type: array
              items:
                type: object
                required: [meter, roomId]
                properties:
                  meter: { type: string }
                  roomId: { type: integer }
        depreciation:
          type: [object, "null"]
          required: [method, usefulLifeMonths, salvagePercent, startConvention]
          properties:
            method: { type: string, enum: [straight_line] }
            usefulLifeMonths: { type: integer }
            salvagePercent: { type: number }
            startConvention: { type: string, enum: [purchase_month, next_month] }
        revenueRecognition: { type: string, enum: [cash, installment_due] }
        basis: { type: string }
    ApprovePolicyRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer }
    CostPolicyState:
      type: object
      required: [draft, draftVersion, approved, approvedVersion, approvedAt, approvedBy, canEdit, canApprove, draftIsApproved, rooms]
      properties:
        draft:
          oneOf:
            - $ref: "#/components/schemas/CostPolicy"
            - type: "null"
        draftVersion: { type: integer }
        approved:
          oneOf:
            - $ref: "#/components/schemas/CostPolicy"
            - type: "null"
        approvedVersion: { type: [integer, "null"] }
        approvedAt: { type: [string, "null"] }
        approvedBy: { type: [string, "null"] }
        canEdit: { type: boolean }
        canApprove: { type: boolean }
        draftIsApproved: { type: boolean }
        rooms:
          type: array
          items:
            type: object
            required: [id, name, branchId]
            properties:
              id: { type: integer }
              name: { type: string }
              branchId: { type: [integer, "null"] }
    CostComponents:
      type: object
      required: [expenses, electricity, depreciation, instructorPay]
      properties:
        expenses: { type: number }
        electricity: { type: number }
        depreciation: { type: number }
        instructorPay: { type: number }
    CostBranchRow:
      type: object
      required: [branchId, name, revenue, cost, totalCost, margin, students, costPerStudent, unallocatedElectricity]
      properties:
        branchId: { type: integer }
        name: { type: string }
        revenue: { type: number }
        cost: { $ref: "#/components/schemas/CostComponents" }
        totalCost: { type: number }
        margin: { type: number }
        students: { type: integer }
        costPerStudent: { type: [number, "null"] }
        unallocatedElectricity: { type: number }
    CostDiplomaRow:
      type: object
      required: [diplomaId, name, revenue, cost, totalCost, margin, students, costPerStudent]
      properties:
        diplomaId: { type: integer }
        name: { type: string }
        revenue: { type: number }
        cost:
          type: object
          required: [electricity, depreciation, instructorPay]
          properties:
            electricity: { type: number }
            depreciation: { type: number }
            instructorPay: { type: number }
        totalCost: { type: number }
        margin: { type: number }
        students: { type: integer }
        costPerStudent: { type: [number, "null"] }
    CostRoomRow:
      type: object
      required: [roomId, name, branchId, heldHours, electricity, depreciation]
      properties:
        roomId: { type: integer }
        name: { type: string }
        branchId: { type: [integer, "null"] }
        heldHours: { type: number }
        electricity: { type: number }
        depreciation: { type: number }
    CostReport:
      type: object
      required: [status, policyVersion, policy, period, branches, diplomas, rooms, totals, warnings]
      properties:
        status: { type: string, enum: [approved, no_approved_policy] }
        policyVersion: { type: [integer, "null"] }
        policy:
          oneOf:
            - $ref: "#/components/schemas/CostPolicy"
            - type: "null"
        period:
          type: [object, "null"]
          required: [from, to]
          properties:
            from: { type: string }
            to: { type: string }
        branches:
          type: array
          items: { $ref: "#/components/schemas/CostBranchRow" }
        diplomas:
          type: array
          items: { $ref: "#/components/schemas/CostDiplomaRow" }
        rooms:
          type: array
          items: { $ref: "#/components/schemas/CostRoomRow" }
        totals:
          type: object
          required: [revenue, totalCost]
          properties:
            revenue: { type: number }
            totalCost: { type: number }
        warnings:
          type: array
          items: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

